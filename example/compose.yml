name: idioca-docs
services:
  web:
    build: ./code
    environment:
      PORT: "${PORT:-8080}"
    ports:
      - target: 8080
        published: "${PORT:-8080}"
        host_ip: 127.0.0.1
        protocol: tcp
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
